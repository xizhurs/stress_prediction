name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality and tests
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check src/stress_prediction tests
      - run: uv run ruff check src/stress_prediction tests
      - run: uv run mypy src/stress_prediction
      - run: uv run pytest --cov=stress_prediction --cov-report=term-missing
      - run: uv build
      - run: uv run stress-prediction --help