[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stress-prediction"
version = "0.1.0"
description = "Vegetation stress prediction from NDVI and climate data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "lightgbm>=4.6,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "optuna>=4.5,<5",
    "optuna-integration[lightgbm]>=4.5,<5",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<0.14",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
geo = [
    "cdsapi>=0.7,<1",
    "climate-indices>=2.2,<3",
    "netcdf4>=1.7,<2",
    "pyarrow>=19,<22",
    "rasterio>=1.4,<2",
    "rioxarray>=0.19,<0.21",
    "xarray>=2025.1,<2027",
]
nn = ["torch>=2.7,<3"]

[project.scripts]
stress-prediction = "stress_prediction.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stress_prediction"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["stress_prediction"]
strict = true

[[tool.mypy.overrides]]
module = ["optuna_integration.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
